[project]
name = "er-save-mcp"
version = "0.1.0"
description = "MCP server to read and edit Elden Ring PS4 saves on a jailbroken PS5"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["fastmcp>=2.0"]

[project.scripts]
er-save-mcp = "ersave.server:main"
ersave = "ersave.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ersave"]
